apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: vehicle-classifier
  namespace: vehicle
spec:
  predictor:
    minReplicas: 1
    annotations:
      # Disable Knative's scale-to-zero so the pod stays warm for the demo.
      # Without this the autoscaler kills the pod after idle, then can't bring
      # it back smoothly on a single-node minikube → ExitCode137 cycling.
      autoscaling.knative.dev/min-scale: "1"
      autoscaling.knative.dev/scale-down-delay: "30m"
    containers:
      - name: kserve-container
        image: vehicle-classifier:dev
        imagePullPolicy: Never
        ports:
          - containerPort: 8000
            protocol: TCP
        env:
          - name: MLFLOW_TRACKING_URI
            value: "http://mlflow-service.mlflow.svc.cluster.local:5000"
          - name: MODEL_URI
            value: "models:/vehicle-type-classifier@champion"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
