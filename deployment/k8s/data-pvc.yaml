apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vehicle-data
  namespace: vehicle
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# Copy in kubeflow namespace because KFP runs workflow pods there by default
# and PVCs can only be mounted from the same namespace as the pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vehicle-data
  namespace: kubeflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
